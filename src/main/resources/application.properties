# ============================================================
# APPLICATION
# ============================================================

# Spring Boot application ka internal name
spring.application.name=student-assistant-backend


# ============================================================
# DATABASE
# ============================================================

# DB_URL environment variable se database URL milega.
# Agar variable nahi mila, local MySQL ka URL use hoga.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_assistant}

# Railway par DB_USERNAME environment variable denge.
# Local mein default username root rahega.
spring.datasource.username=${DB_USERNAME:root}

# Database password environment variable se aayega.
# Isse password source code mein hardcode nahi rahega.
spring.datasource.password=${DB_PASSWORD}


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Existing database tables ko automatically update karega.
spring.jpa.hibernate.ddl-auto=update

# SQL queries console mein unnecessarily print nahi hongi.
spring.jpa.show-sql=false

# Hibernate SQL ko readable format mein rakhega.
spring.jpa.properties.hibernate.format_sql=true